# Read the Docs configuration file (v2 schema).
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Note: build.image and python.version are deprecated/removed as of the
# current schema -- this uses the current build.os + build.tools.python keys.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # pandoc is required by nbsphinx to render the pre-executed example
  # notebooks (notebooks/*.ipynb) into the docs site; it is NOT installed by
  # pip, so it must be listed here explicitly.
  apt_packages:
    - pandoc

sphinx:
  configuration: docs/conf.py
  # Kept non-fatal rather than a hard gate: this repo's own build sandbox
  # (restricted network access) surfaces a few intersphinx "failed to reach
  # inventory" warnings that a real, internet-connected Read the Docs build
  # likely won't hit -- but that hasn't been verified against an actual RTD
  # build, so failing the build on any warning isn't a risk worth taking
  # sight-unseen. Revisit once a real RTD build has been observed clean.
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

formats: []

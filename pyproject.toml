[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyunwrap-insar"
version = "0.1.1"
description = "AI-driven InSAR phase unwrapping via a Physics-Informed U-Net (Ambiguity-Net) that predicts the discrete integer ambiguity map, enforcing the rewrapping constraint by construction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Samuel Appiah Kubi" }
]
keywords = [
    "InSAR",
    "phase-unwrapping",
    "SAR",
    "remote-sensing",
    "deep-learning",
    "earth-observation",
    "geospatial",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch>=2.1",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "numpy>=1.24",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "shap>=0.44",
    "plotly>=5.18",
    "pyvista>=0.43",
    "jinja2>=3.1",
    "onnxruntime>=1.16",
    "scipy>=1.11",
    "tqdm>=4.66",
    "pandas>=2.1",
    "tensorboard>=2.15",
    "h5py>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.12",
    "ruff>=0.1.9",
    "mypy>=1.7",
]
maps = [
    "folium>=0.15",
    "leafmap>=0.30",
]
deploy = [
    "openvino>=2023.2",
    "onnx>=1.16",
    "onnxconverter-common>=1.14",
    "onnxscript>=0.1",  # required by torch>=2.9's default (dynamo) ONNX exporter
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]
snaphu = [
    "snaphu>=0.4.0",  # official isce-framework Python bindings; bundles its
    # own compiled SNAPHU binary, no separate system package needed. Powers
    # pyunwrap.utils.snaphu_integration, which builds the pseudo-ground-truth
    # fine-tuning datasets Trainer's finetune_dataset expects.
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
    "sphinx-design>=0.5",
    "nbsphinx>=0.9",  # renders the pre-executed example notebooks; requires
    # a system 'pandoc' install (not a pip package) -- see .readthedocs.yaml's
    # apt_packages for the hosted build, or `apt install pandoc` locally.
]

[project.urls]
Homepage = "https://github.com/EOCoreINT/pyunwrap"
Repository = "https://github.com/EOCoreINT/pyunwrap"
Issues = "https://github.com/EOCoreINT/pyunwrap/issues"

[project.scripts]
pyunwrap-train = "pyunwrap.training.trainer:main"
pyunwrap-unwrap = "pyunwrap.inference.hybrid:main"

[tool.setuptools.packages.find]
include = ["pyunwrap*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow integration tests (deselect with '-m \"not slow\"')",
]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# BLE001 (blind `except Exception`) and S110 (bare except-pass) are disabled
# project-wide: pyunwrap deliberately uses broad exception handling in several
# well-documented places where failure must degrade gracefully rather than
# propagate -- e.g. the ONNX/OpenVINO backend fallback chain
# (utils/deployment.py), best-effort HTML report generation that must never
# take down a production inference call (inference/unwrapper.py,
# analytics/report_generator.py), optional ImageNet-pretrained-weight
# download (models/ambiguity_net.py), and a destructor's best-effort file
# handle cleanup (data/dataloader.py). Each site already documents its
# rationale in a comment/docstring at the point of use.
ignore = ["BLE001", "S110"]

[tool.mypy]
python_version = "3.10"
# warn_return_any is deliberately off: numpy/torch's type stubs frequently
# type common operations (e.g. np.angle, tensor arithmetic chains) as
# returning Any even though the actual runtime type is exactly what the
# function signature declares. Verified by manual inspection that every
# instance flagged in this codebase was a stub-typing limitation, not a
# real bug, before choosing to disable this check rather than scatter
# `# type: ignore[no-any-return]` across ~15 call sites for no functional
# benefit. Genuine type errors (wrong argument types, missing None checks,
# etc.) are still caught -- see the `# type: ignore[arg-type]` comments at
# the two remaining known third-party stub limitations
# (numpy.savez_compressed's **kwargs typing, torch.onnx.export's Tensor-vs-
# tuple `args` parameter) for the same reasoning applied precisely rather
# than globally.
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

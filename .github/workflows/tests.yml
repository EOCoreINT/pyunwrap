name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    # Runs on every push/PR: the full suite minus @pytest.mark.slow, across
    # the supported Python matrix. Kept fast so it can gate every commit.
    name: fast tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies (GDAL, for rasterio/geopandas)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev gdal-bin

      - name: Install pyunwrap (with dev + maps extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,maps]"

      - name: Run fast test suite with coverage
        run: |
          pytest tests/ -m "not slow" -v \
            --cov=pyunwrap --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  slow-tests:
    # The full synthetic->train->infer->report integration test
    # (@pytest.mark.slow). Runs once (not matrixed) to keep CI time
    # reasonable, on a single representative Python version.
    name: slow / integration tests
    runs-on: ubuntu-latest
    needs: fast-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies (GDAL, for rasterio/geopandas)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev gdal-bin

      - name: Install pyunwrap (with dev + maps extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,maps]"

      - name: Run slow / integration test suite
        run: |
          pytest tests/ -m "slow" -v

  lint:
    name: lint (ruff + black --check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check pyunwrap tests

      - name: Run black --check
        run: black --check pyunwrap tests
